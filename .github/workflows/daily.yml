name: Daily Mugin Lab Update

on:
  schedule:
    # 08:00 UTC-04:00 = 12:00 UTC during standard time; adjust if DST changes.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install --upgrade pytest
      - name: Run safety tests
        run: pytest -q
      - name: Add daily challenge note
        run: |
          mkdir -p docs/daily
          printf '# Daily challenge\n\nGenerated on %s UTC.\n\nThis placeholder requires a reviewed, local-only challenge before merge.\n' "$(date -u +%F)" > "docs/daily/$(date -u +%F).md"
      - name: Commit reviewed-safe update
        run: |
          git config user.name 'mugin-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/daily
          git diff --cached --quiet || git commit -m "chore: daily safe lab update $(date -u +%F)"
          git push
